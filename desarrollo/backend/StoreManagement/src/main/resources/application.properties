spring.application.name=StoreManagement

# Docker Compose Support (deshabilitar en prod)
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.wait=ALWAYS

# Server Port
server.port=${PORT:8080}

# PostgreSQL - IMPORTANT: Override DB_PASSWORD environment variable in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/store_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}

# JPA
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# RabbitMQ - IMPORTANT: Override RABBITMQ_PASSWORD environment variable in production
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:K8QKjD*Da~2MfxM}
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Módulo Usuarios (External Service)
modulo.usuarios.base-url=${MODULO_USUARIOS_URL:http://localhost:8081}
modulo.usuarios.timeout.connect=${MODULO_USUARIOS_CONNECT_TIMEOUT:2000}
modulo.usuarios.timeout.read=${MODULO_USUARIOS_READ_TIMEOUT:5000}

# Resilience4j - CircuitBreaker
resilience4j.circuitbreaker.instances.moduloUsuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.moduloUsuarios.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.moduloUsuarios.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.moduloUsuarios.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.moduloUsuarios.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.moduloUsuarios.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.moduloUsuarios.sliding-window-size=10

# JWT - IMPORTANT: Override JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
resilience4j.retry.instances.moduloUsuarios.wait-duration=500ms
resilience4j.retry.instances.moduloUsuarios.retry-exceptions[0]=java.net.SocketTimeoutException
resilience4j.retry.instances.moduloUsuarios.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# OpenAPI / Swagger
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
openapi.server-description=${OPENAPI_SERVER_DESC:Local Development Server}
openapi.prod-url=${OPENAPI_PROD_URL:https://api.storemanagement.com}
openapi.prod-description=${OPENAPI_PROD_DESC:Production Server}

# Async Thread Pool
spring.task.execution.pool.core-size=${ASYNC_CORE_POOL:2}
spring.task.execution.pool.max-size=${ASYNC_MAX_POOL:5}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# App URLs (notificaciones externas)
app.notificaciones.supervisor.url=${NOTIFICACIONES_SUPERVISOR_URL:}
app.notificaciones.supervisor.excepciones.url=${NOTIFICACIONES_EXCEPCIONES_URL:}
app.modulo.transporte.notificacion.url=${NOTIFICACIONES_TRANSPORTE_URL:}
