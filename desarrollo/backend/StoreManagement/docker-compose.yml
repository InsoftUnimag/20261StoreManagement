services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-store
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: store_management
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d store_management"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inventario_shared_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: store_shared_rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_NODENAME: rabbit@localhost
      RABBITMQ_LOAD_DEFINITIONS: "true"
    volumes:
      - ./rabbitmq_definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inventario_shared_net

volumes:
  postgres_data:

networks:
  inventario_shared_net:
    driver: bridge
